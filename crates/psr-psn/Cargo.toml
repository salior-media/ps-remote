[package]
name = "psr-psn"
version = "0.1.0"
description = "Remote Play over PSN: signing in on Sony's page, and the account's consoles. Ported from chiaki-ng."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "=0.23.1"
psr-lan = { path = "../psr-lan" }
serde_json = "=1.0.152"
thiserror = "=2.0.21"
ureq = { version = "=3.5.0", features = ["json"] }
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
getrandom = "=0.4.3"

[lints]
workspace = true
