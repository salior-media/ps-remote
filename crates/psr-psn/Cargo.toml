[package]
name = "psr-psn"
version = "0.1.0"
description = "Remote Play over PSN: signing in on Sony's page, and the account's consoles. Ported from chiaki-ng."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "=0.23.1"
getrandom = "=0.4.3"
psr-lan = { path = "../psr-lan" }
# The same rustls ureq uses, for the push websocket's TLS (see push.rs).
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "=1.0.152"
thiserror = "=2.0.21"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "=3.5.0", features = ["json"] }
url = "=2.5.8"
webpki-roots = "=1.0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
sha2 = "=0.11.1"

[lints]
workspace = true
