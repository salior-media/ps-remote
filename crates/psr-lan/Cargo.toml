[package]
name = "psr-lan"
version = "0.1.0"
description = "Remote Play on the home network: finding, waking and linking consoles, and starting a stream. Ported from chiaki-ng."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "=0.23.1"
getrandom = "=0.4.3"
prost = "=0.14.4"
psr-av = { path = "../psr-av" }
psr-input = { path = "../psr-input" }
psr-crypto = { path = "../psr-crypto" }
psr-proto = { path = "../psr-proto" }
psr-takion = { path = "../psr-takion" }
thiserror = "=2.0.21"

[dev-dependencies]
serde_json = "=1.0.152"
ureq = { version = "=3.5.0", features = ["json"] }
url = "=2.5.8"

[lints]
workspace = true
