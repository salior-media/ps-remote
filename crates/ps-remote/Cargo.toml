[package]
name = "ps-remote"
version = "0.1.0"
description = "The ps-remote service: plays a linked PlayStation in a browser over WebRTC, through a local API."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "=0.8.9"
getrandom = "=0.4.3"
psr-av = { path = "../psr-av" }
psr-input = { path = "../psr-input" }
psr-lan = { path = "../psr-lan" }
psr-psn = { path = "../psr-psn" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
# Pure-Rust crypto, like psr-crypto: no OpenSSL or C toolchain. 0.25.0 because 0.26.0 is under two weeks old.
str0m = { version = "=0.25.0", default-features = false, features = ["rust-crypto"] }
subtle = "=2.6.1"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "sync"] }

[dev-dependencies]
psr-crypto = { path = "../psr-crypto" }
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
